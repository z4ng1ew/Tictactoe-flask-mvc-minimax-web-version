<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Крестики-Нолики</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 30px; }
    .board { display: inline-grid; grid-template-columns: repeat(3, 80px); gap: 6px; margin: 20px 0; }
    .cell {
      width: 80px; height: 80px; font-size: 32px;
      border: 2px solid #333; background: #f5f5f5; cursor: pointer;
    }
    .cell:disabled { cursor: not-allowed; background: #e0e0e0; }
  </style>
</head>
<body>
  <h1>Крестики-Нолики</h1>
  <div id="status">Загрузка...</div>
  <div class="board" id="board"></div>
  <br>
  <button onclick="startNewGame()">Новая игра</button>
  <div id="gameId" style="font-size:11px;color:#999;margin-top:10px;"></div>

  <script>
    const LINES = [
      [[0,0],[0,1],[0,2]], [[1,0],[1,1],[1,2]], [[2,0],[2,1],[2,2]],
      [[0,0],[1,0],[2,0]], [[0,1],[1,1],[2,1]], [[0,2],[1,2],[2,2]],
      [[0,0],[1,1],[2,2]], [[0,2],[1,1],[2,0]]
    ];

    let gameId, board, gameActive;

    function startNewGame() {
      gameId = crypto.randomUUID();
      board = Array(3).fill(null).map(() => Array(3).fill(0));
      gameActive = true;
      render();
      setStatus('Твой ход (X)');
      document.getElementById('gameId').textContent = 'ID: ' + gameId;
    }

    function render() {
      const el = document.getElementById('board');
      el.innerHTML = '';
      for (let r = 0; r < 3; r++) {
        for (let c = 0; c < 3; c++) {
          const btn = document.createElement('button');
          btn.className = 'cell';
          btn.textContent = board[r][c] === 1 ? 'X' : board[r][c] === 2 ? 'O' : '';
          btn.disabled = !gameActive || board[r][c] !== 0;
          btn.onclick = () => makeMove(r, c);
          el.appendChild(btn);
        }
      }
    }

    async function makeMove(r, c) {
      if (!gameActive || board[r][c] !== 0) return;
      board[r][c] = 1;
      render();
      setStatus('Думаю...');
      try {
        const resp = await fetch(`/game/${gameId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: gameId, board: { matrix: board, size: 3 } })
        });
        if (!resp.ok) throw new Error((await resp.json()).description || 'Ошибка сервера');
        board = (await resp.json()).board.matrix;
        render();
        checkResult();
      } catch (e) {
        board[r][c] = 0;
        render();
        setStatus('Ошибка: ' + e.message);
      }
    }

    function winner() {
      for (const [[r1,c1],[r2,c2],[r3,c3]] of LINES)
        if (board[r1][c1] && board[r1][c1] === board[r2][c2] && board[r2][c2] === board[r3][c3])
          return board[r1][c1];
      return 0;
    }

    function checkResult() {
      const w = winner();
      if (w === 1)      { setStatus('Ты победил!');        gameActive = false; }
      else if (w === 2) { setStatus('Компьютер выиграл.'); gameActive = false; }
      else if (board.flat().every(v => v)) { setStatus('Ничья!'); gameActive = false; }
      else setStatus('Твой ход (X)');
    }

    function setStatus(text) { document.getElementById('status').textContent = text; }

    startNewGame();
  </script>
</body>
</html>
